<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso de espanhol — precisão para quem fala português</title>
<style>
:root{
  --papel:#F4F5F1; --papel-alto:#FBFCFA; --pedra:#E1E5DD;
  --tinta:#1B2027; --tinta-fraca:#5C6670;
  --caneta:#2E4FA3; --revisao:#9E2B2B; --oliva:#4C6B3C; --ocre:#A9741B;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);
     font-size:17px;line-height:1.55}
.pagina{max-width:72ch;margin:0 auto;padding:2.5rem 1rem 5rem}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0}
h1{font-size:2.3rem;letter-spacing:-.015em}
h2{font-size:1.35rem;margin:2.5rem 0 .75rem;padding-top:1rem;border-top:1px solid var(--pedra)}
h3{font-size:1rem;margin:1.5rem 0 .5rem}
p{margin:1rem 0}
.sub{color:var(--tinta-fraca);max-width:60ch}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--pedra);
     padding:.1em .35em;border-radius:2px}
.folha{background:var(--papel-alto);border:1px solid var(--pedra);border-radius:var(--r);
       padding:1.5rem;margin-top:1rem}
.oculto{display:none!important}

.par .pt{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--tinta-fraca);
  text-decoration:line-through;text-decoration-color:var(--revisao)}
.par .es{display:block;font-family:var(--serif);font-size:2rem;line-height:1.15;margin-top:.1em}

.enunciado{font-family:var(--serif);font-size:1.3rem;line-height:1.4;margin:0 0 1rem}
.alternativas{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.alt{display:flex;gap:.75rem;align-items:baseline;width:100%;text-align:left;
  background:var(--papel-alto);border:1px solid var(--pedra);border-radius:var(--r);
  padding:.7rem .9rem;font:inherit;color:inherit;cursor:pointer;min-height:44px}
.alt:hover{border-color:var(--caneta)}
.alt:focus-visible{outline:2px solid var(--caneta);outline-offset:2px}
.alt[data-e="certo"]{border-color:var(--oliva);background:#F1F5EE}
.alt[data-e="erro"]{border-color:var(--revisao);background:#FBF1F1}
.alt[data-e="pt"]{border-color:var(--revisao);background:#FBF1F1}
.alt .tecla{font-family:ui-monospace,monospace;font-size:.8rem;color:var(--tinta-fraca);
  border:1px solid var(--pedra);border-radius:2px;padding:0 .35em}
.explicacao{margin-top:1rem;border-left:3px solid var(--caneta);padding-left:1rem}
.frase{font-family:var(--serif);font-size:1.2rem;margin:0}
.regra{margin:.6rem 0 0;font-size:.98rem}
.regra b{color:var(--revisao)}
.sessao{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--tinta-fraca);
        margin-bottom:1rem}
.pontos{display:flex;gap:3px;flex:1}
.pontos i{height:3px;flex:1;background:var(--pedra);border-radius:2px}
.pontos i.ok{background:var(--oliva)} .pontos i.x{background:var(--revisao)}
.pontos i.now{background:var(--caneta)}
.acoes{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.5rem;align-items:center}
.btn{background:var(--caneta);color:#fff;border:1px solid var(--caneta);border-radius:var(--r);
  padding:.65rem 1.1rem;cursor:pointer;font:inherit;min-height:44px}
.btn:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.btn-sec{background:transparent;color:var(--tinta);border-color:var(--pedra)}
.btn-saida{background:none;border:none;color:var(--tinta-fraca);text-decoration:underline;
  cursor:pointer;padding:.65rem 0;font:inherit}
textarea{width:100%;min-height:8rem;font:inherit;padding:.75rem;border:1px solid var(--pedra);
  border-radius:var(--r);background:var(--papel-alto);color:inherit;resize:vertical}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}
.metrica .valor{font-family:var(--serif);font-size:2rem;line-height:1}
.metrica .rot{font-size:.85rem;color:var(--tinta-fraca)}
.metrica .barra{height:5px;background:var(--pedra);border-radius:3px;margin-top:.4rem;
  overflow:hidden}
.metrica .barra span{display:block;height:100%;background:var(--caneta)}
.metrica[data-t="alerta"] .valor{color:var(--revisao)}
.metrica[data-t="alerta"] .barra span{background:var(--revisao)}
.metrica[data-t="bom"] .valor{color:var(--oliva)}
.metrica[data-t="bom"] .barra span{background:var(--oliva)}
.niveis{list-style:none;margin:0;padding:0}
.niveis li{display:grid;grid-template-columns:12rem 1fr 3rem;gap:.6rem;align-items:center;
  padding:.45rem 0;border-bottom:1px solid var(--pedra)}
.trilho{height:6px;background:var(--pedra);border-radius:3px;position:relative}
.trilho span{position:absolute;top:0;bottom:0;left:0;background:var(--caneta);border-radius:3px}
.qecr{font-family:var(--serif);font-size:1.1rem;text-align:right}
.aviso{border:1px solid var(--pedra);border-left:3px solid var(--ocre);background:var(--papel-alto);
  border-radius:var(--r);padding:1rem 1.5rem;margin-top:1rem}
.ouvido b{color:var(--revisao)}
.marcado{color:var(--revisao);text-decoration:underline;text-decoration-style:wavy}
.lista-lim{font-size:.95rem;color:var(--tinta-fraca)}
@media (max-width:520px){h1{font-size:1.8rem}.niveis li{grid-template-columns:8.5rem 1fr 2.5rem}}
@media (prefers-reduced-motion:no-preference){.alt{transition:border-color .12s ease}}
</style>
</head>

,{"id":"LEC10","bl":"leitura","b":-0.6,"a":1.6,"tr":"opaco","p":"¿Qué le duele?","base":"Me duele la espalda desde ayer.","o":["O ombro","As costas","A espádua","A cabeça"],"g":1,"d":0,"niv":"A2"},{"id":"LEC11","bl":"leitura","b":-0.4,"a":1.6,"tr":"opaco","p":"¿Cómo estaba el postre?","base":"El postre estaba exquisito.","o":["Esquisito","Delicioso","Sem gosto","Requintado no preço"],"g":1,"d":0,"niv":"A2"},{"id":"LEC12","bl":"leitura","b":-0.3,"a":1.6,"tr":"opaco","p":"¿Qué te piden?","base":"Quítate el abrigo, aquí hace calor.","o":["Que aqueça o casaco","Que tire o casaco","Que quite a conta","Que troque de casaco"],"g":1,"d":0,"niv":"A2"},{"id":"LEC13","bl":"leitura","b":-0.1,"a":1.6,"tr":"opaco","p":"¿Qué pide el aviso?","base":"AVISO: Se ruega no dejar las bicicletas en el pasillo.","o":["Não deixar bicicletas na calçada","Não deixar bicicletas no corredor","Não passear de bicicleta","Deixar as bicicletas no pátio"],"g":1,"d":0,"niv":"A2"},{"id":"LEC14","bl":"leitura","b":0.1,"a":1.6,"tr":"opaco","p":"¿Qué significa?","base":"Llevo tres años viviendo en Lima.","o":["Levo três anos para ir a Lima","Moro em Lima há três anos","Vou morar três anos em Lima","Levei três anos morando em Lima"],"g":1,"d":0,"niv":"B1"},{"id":"LEC15","bl":"leitura","b":0.3,"a":1.6,"tr":"opaco","p":"¿Quién olvidó las llaves?","base":"Se me olvidaron las llaves en casa.","o":["Ninguém, elas se perderam","Eu","Outra pessoa","Não é possível saber"],"g":1,"d":3,"niv":"B1"},{"id":"LEC16","bl":"leitura","b":0.5,"a":1.3,"tr":"opaco","p":"¿Qué se puede concluir?","base":"Marta pensaba llegar a las siete, pero el tren se retrasó y, para colmo, se le acabó la batería del móvil. Cuando por fin apareció, ya habían recogido las mesas.","o":["Marta chegou depois do jantar","Marta não foi ao encontro","Marta chegou antes do previsto","Marta avisou que se atrasaria"],"g":0,"d":3,"niv":"B1"},{"id":"LEC17","bl":"leitura","b":0.6,"a":1.6,"tr":"opaco","p":"¿Qué te aconsejan?","base":"No le hagas caso, siempre exagera.","o":["Que faça o caso dele","Que não dê atenção a ele","Que não o processe","Que o acompanhe"],"g":1,"d":0,"niv":"B1"},{"id":"LEC18","bl":"leitura","b":0.8,"a":1.6,"tr":"opaco","p":"¿Dónde se quedaron?","base":"Se puso a llover y nos quedamos en el sitio una hora más.","o":["Num sítio de campo","No mesmo lugar","Numa casa alugada","Num abrigo"],"g":1,"d":0,"niv":"B1"},{"id":"LEC19","bl":"leitura","b":1.0,"a":1.6,"tr":"opaco","p":"¿Qué ocurrió?","base":"Pese a que se lo habían advertido, siguió adelante con el proyecto.","o":["Ele parou por causa do aviso","Ele continuou apesar do aviso","Ele avisou os outros","Ele adiou o projeto"],"g":1,"d":0,"niv":"B2"},{"id":"LEC20","bl":"leitura","b":1.2,"a":1.3,"tr":"opaco","p":"¿Cuál es la postura del autor?","base":"El nuevo reglamento promete agilizar los trámites. Ahora bien, quienes lo han leído con detenimiento advierten que multiplica los formularios y traslada el coste al ciudadano.","o":["Aprova o regulamento","É crítico, com reservas explícitas","É neutro e apenas informa","Elogia a redução de custos"],"g":1,"d":2,"niv":"B2"},{"id":"LEC21","bl":"leitura","b":1.4,"a":1.6,"tr":"opaco","p":"¿Qué dice el hablante?","base":"No es que no quiera ayudarte, es que no puedo.","o":["Ele não quer ajudar","Ele quer ajudar, mas está impedido","Ele já ajudou o suficiente","Ele vai ajudar mais tarde"],"g":1,"d":0,"niv":"B2"},{"id":"LEC22","bl":"leitura","b":1.6,"a":1.6,"tr":"opaco","p":"¿Cómo reaccionó?","base":"Se lo tomó a pecho y no volvió a hablarnos.","o":["Levou na esportiva","Ficou magoado e levou a sério","Peitou o problema","Não entendeu"],"g":1,"d":2,"niv":"B2"},{"id":"LEC23","bl":"leitura","b":2.05,"a":1.6,"tr":"opaco","p":"¿Qué expresa el hablante?","base":"Menuda faena nos hicieron con el cambio de fecha.","o":["Gratidão","Indiferença","Queixa por um prejuízo","Surpresa agradável"],"g":2,"d":-1,"niv":"C1"},{"id":"LEC24","bl":"leitura","b":2.1,"a":1.3,"tr":"opaco","p":"¿Qué tono predomina?","base":"Tras diez años de promesas, el ayuntamiento inauguró por fin la biblioteca: doscientos metros cuadrados, cuatro estanterías y un horario que no llega a las tardes. Todo un hito.","o":["Entusiasmo sincero","Ironia crítica","Neutralidade informativa","Nostalgia"],"g":1,"d":0,"niv":"C1"},{"id":"LEC25","bl":"leitura","b":2.3,"a":1.6,"tr":"opaco","p":"¿Qué hizo?","base":"A fin de cuentas, no le quedó más remedio que apechugar con las consecuencias.","o":["Fugiu do problema","Assumiu e aguentou as consequências","Peitou os responsáveis","Negociou uma saída"],"g":1,"d":2,"niv":"C1"},{"id":"LEC26","bl":"leitura","b":2.6,"a":1.6,"tr":"opaco","p":"¿Qué hizo?","base":"Cuando le preguntaron por el dinero, se hizo el sueco.","o":["Falou sueco","Fingiu não entender","Ficou vermelho","Devolveu o dinheiro"],"g":1,"d":0,"niv":"C1"},{"id":"LEC27","bl":"leitura","b":3.05,"a":1.3,"tr":"opaco","p":"¿Qué registro y qué se propone?","base":"Convendría, siquiera por prudencia, no aventurar conclusiones antes de que el informe vea la luz.","o":["Coloquial; propõe divulgar já","Formal cauteloso; propõe esperar o relatório","Formal; afirma que o relatório está errado","Neutro; pede opinião"],"g":1,"d":-1,"niv":"C2"},{"id":"LEC28","bl":"leitura","b":3.2,"a":1.6,"tr":"opaco","p":"¿Qué se afirma?","base":"El discurso rezumaba una condescendencia difícilmente disimulable.","o":["O discurso era humilde","O discurso transbordava superioridade mal escondida","O discurso era confuso","O discurso foi bem recebido"],"g":1,"d":-1,"niv":"C2"},{"id":"LEC29","bl":"leitura","b":3.5,"a":1.6,"tr":"opaco","p":"¿Qué añade la frase?","base":"Ni que decir tiene que el acuerdo se firmó a regañadientes.","o":["Que ninguém falou do acordo","Que é óbvio que assinaram, e a contragosto","Que o acordo não foi assinado","Que assinaram com entusiasmo"],"g":1,"d":-1,"niv":"C2"},{"id":"LEC30","bl":"leitura","b":1.7,"a":1.3,"tr":"opaco","p":"¿Quién debe presentar carta de aval?","base":"La convocatoria exige acreditar dos años de exp ","g":"média","cf":"alta"},{"id":"D21","re":"\\b(policia|democracia\\b(?!s)|academia\\b(?!s)|dia|mas\\s+o\\s+menos)\\b","fl":"gi","e":"Acento ou tônica divergente do português.","g":"média","cf":"baixa"},{"id":"D22","re":"\\b\\w*ção\\b|\\b\\w*ções\\b","fl":"gi","e":"O sufixo espanhol é -ción / -ciones.","g":"alta","cf":"alta"},{"id":"D23","re":"(?:^|(?<=[.!?] ))(?!¿)[^.?!¿]{3,}\\?","fl":"gim","e":"Pergunta em espanhol abre com ¿.","g":"média","cf":"média"},{"id":"D24","re":"(?:^|(?<=[.!?] ))(?!¡)[^.?!¡]{2,}\\!","fl":"gim","e":"Exclamação em espanhol abre com ¡.","g":"baixa","cf":"média"},{"id":"D25","re":"\\bpara\\s+(yo|tú)\\b","fl":"gi","e":"Depois de preposição usam-se mí e ti.","g":"alta","cf":"alta"},{"id":"D26","re":"\\bmuy\\s+\\w+ísimo\\b","fl":"gi","e":"O sufixo -ísimo já é superlativo; não se combina com «muy».","g":"baixa","cf":"alta"},{"id":"D27","re":"\\bse\\s+vende\\s+\\w+s\\b","fl":"gi","e":"Passiva refleja concorda com o objeto: «se venden».","g":"média","cf":"média"},{"id":"D28","re":"\\btodavía\\s+(sin\\s+embargo|pero)\\b|\\btodavía,\\b","fl":"gi","e":"«Todavía» significa «ainda», não «todavia».","g":"média","cf":"baixa"}],"lus":["eu","você","voce","nao","não","muito","então","entao","também","tambem","obrigado","coisa","trabalho","cidade","pessoa","quando","quanto","tempo","dinheiro","melhor","hoje","ontem","aqui","agora","sempre","mesmo","fazer","fazendo","tenho","vou","estou","sou","somos","rua","igreja","mulher","homem","menino","menina","criança","bonita","ônibus","trem","amanhã","depois","antes","porém","contudo","entretanto"],"p":{"estab":[1,1,3,7,21,60],"pontos":[2,3,5,8,12],"revisar":0.9,"rebaixar":0.5,"cota":3,"n":12,"peso":{"mc":1,"guiada":2,"livre":3,"fala":4,"escuta":1},"alvo":0.8},"pendentes":161};
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const app = document.getElementById('app');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NIVEIS = ["A0","A1","A2","B1","B2","C1","C2"];

/* ---------------------------------------------------------------- estado */
const CHAVE='es_v1', CHAVE_BK='es_backup';
const VERSAO_ESTADO=1;

function novoEstado(){
  return {v:VERSAO_ESTADO, criado:Date.now(), perfil:{objetivo:null,contato:null},
    theta:{leitura:null,escuta:null,uso:null}, nos:{}, itens:{}, dia:0, posicao:0,
    xp:0, seq:{dias:0, ultimo:null}, metricas:{portunhol:[], sondas:{ok:0,tot:0}},
    diagFeito:false, hist:{no:[],f:[]}};
}
function migrar(e){
  if(!e || typeof e!=='object') return novoEstado();
  if(e.v===VERSAO_ESTADO) return e;
  localStorage.setItem(CHAVE_BK, JSON.stringify(e));   // cópia antes de tudo
  const base=novoEstado();
  for(const k in base) if(!(k in e)) e[k]=base[k];     // aditiva: só acrescenta
  e.v=VERSAO_ESTADO;
  return e;
}
let S;
try{ S = migrar(JSON.parse(localStorage.getItem(CHAVE))); }catch(_){ S = novoEstado(); }
const salvar = ()=>{ try{localStorage.setItem(CHAVE, JSON.stringify(S));}catch(_){ } };

/* ------------------------------------------------------------- índices */
const ATIV_POR_NO={}; D.ativs.forEach(a=>{(ATIV_POR_NO[a.no] ||= []).push(a)});
const LIC_POR_NO={}; D.licoes.forEach((l,i)=>{LIC_POR_NO[l.no]={...l,i}});
const ORDEM_NOS = D.licoes.map(l=>l.no);
const NO_DE_ATIV = a=>a.pai||a.no;

/* --------------------------------------------------- modelo de memória */
const est = n => S.nos[n] || (S.nos[n]={d:0,p:0,s:1,u:null,ses:[]});
const retencao = n=>{ const e=est(n); if(e.u===null) return 0;
  return Math.exp(-(S.dia-e.u)/Math.max(.5,e.s)); };
function registrar(no,f,acerto){
  const e=est(no), w=D.p.peso[f]||1;
  if(acerto){
    e.p+=w;
    e.s=Math.max(e.s, D.p.estab[e.d])*(1.6+0.4*w);
    if(!e.ses.includes(S.dia)) e.ses.push(S.dia);
    if(e.d<5 && e.p>=D.p.pontos[e.d]){
      const podeSubir = e.d<3 || (e.ses.length>=2 && (e.ses[e.ses.length-1]-e.ses[0])>=7);
      const exigeFala = e.d===4 ? f==='fala' : true;
      if(podeSubir && exigeFala){ e.d++; e.p=0; }
    }
  } else { e.s*=0.4; }
  e.u=S.dia;
}
function rebaixar(){
  for(const n in S.nos){ const e=S.nos[n];
    if(e.d>=2 && retencao(n)<D.p.rebaixar){ e.d--; e.p=0; e.s=D.p.estab[e.d]; } }
}

/* ------------------------------------------------------------- seleção */
const podeServir = no => !(S.hist.no.slice(-2).length===2 && S.hist.no.slice(-2).every(x=>x===no));
function prereqOk(no){
  const pre = D.pre[no]||[];
  return pre.every(p => (est(p).d>=2) || ((D.crit[p]||0) < 15));
}
const pAcerto = (no,f)=>Math.max(.05,Math.min(.98, 0.66+0.070*est(no).d - 0.085*((D.p.peso[f]||1)-1)));

const NIV_I = n=>NIVEIS.indexOf(n);
function escolher(){
  // A janela não pode ser só a das lições: a maior parte das atividades prontas está em nós
  // lexicais e fonéticos, que não aparecem na ordem da matriz.
  const lic = D.licoes[Math.min(S.posicao, D.licoes.length-1)];
  const maxNiv = NIV_I(lic.niv) + 1;
  const alvo = lic.no;
  let melhor=null, ms=-1e9;
  for(const a of D.ativs){
    if(NIV_I(a.niv) > maxNiv) continue;
    const no=a.no;
    if(!prereqOk(no) || !podeServir(no)) continue;
    let s=0;
    const r=retencao(no);
    if(est(no).u!==null && r<D.p.revisar && est(no).d>0) s+=100*(D.p.revisar-r);
    if(no===alvo) s+=70;
    const p=pAcerto(no,a.f);
    s+=70*(1-Math.abs(p-D.p.alvo)/D.p.alvo);
    if(p<0.55) s-=160*(0.55-p);
    if(S.hist.f.slice(-1)[0]===a.f) s-=30;
    if(S.itens[a.id]) s-= (est(no).d>=3 ? 400 : 120);   // não repetir item já feito
    s += Math.random()*8;                                // desempate, sem decidir nada
    if(s>ms){ ms=s; melhor=a; }
  }
  if(!melhor){
    const cands=D.ativs.filter(a=>!S.itens[a.id] && podeServir(a.no));
    melhor = cands[Math.floor(Math.random()*cands.length)] || D.ativs[0];
  }
  return melhor;
}
function manutencao(){
  const cands = Object.keys(S.nos)
    .filter(n=>est(n).d>=1 && retencao(n)<D.p.revisar && podeServir(n) && (ATIV_POR_NO[n]||[]).length)
    .sort((a,b)=>retencao(a)-retencao(b));
  if(!cands.length) return null;
  const n=cands[0], d=est(n).d;
  const pref = d<3 ? ['mc'] : (d<4 ? ['guiada','livre','mc'] : ['fala','livre','mc']);
  for(const f of pref){ const a=(ATIV_POR_NO[n]||[]).find(x=>x.f===f); if(a) return a; }
  return (ATIV_POR_NO[n]||[])[0];
}

/* ------------------------------------------------- detector de portunhol */
const DET = D.det.map(r=>{
  try{ return {...r, rx:new RegExp(r.re, r.fl||'gi')}; }
  catch(_){ return null; }                       // regra inválida some, não derruba o site
}).filter(Boolean);
const LUS = new Set(D.lus);
function analisar(txt){
  const achados=[];
  DET.forEach(r=>{ r.rx.lastIndex=0; let m;
    while((m=r.rx.exec(txt))!==null){ if(!m[0].trim()) break;
      achados.push({id:r.id, t:m[0].trim(), e:r.e, cf:r.cf}); if(m.index===r.rx.lastIndex) r.rx.lastIndex++; }});
  const pal = (txt.toLowerCase().match(/[a-záéíóúüñãõç]+/g)||[]);
  pal.forEach(p=>{ if(LUS.has(p)) achados.push({id:'LEX',t:p,
    e:'Palavra portuguesa: não existe em espanhol.',cf:'alta'}); });
  return {achados, n:pal.length, indice: pal.length? +(100*achados.length/pal.length).toFixed(1):0};
}

let vozES=null;
function carregarVoz(){
  const vs=speechSynthesis.getVoices();
  vozES = vs.find(v=>/es-MX|es_MX/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ carregarVoz(); speechSynthesis.onvoiceschanged=carregarVoz; }
function falar(texto, vel=1){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(texto);
  u.lang='es-MX'; u.rate=vel; if(vozES) u.voice=vozES;
  speechSynthesis.speak(u);
}
const TemReconhecimento = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
function ouvir(cb){
  const R = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){ cb(null); return; }
  const r=new R(); r.lang='es-MX'; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=e=>cb(e.results[0][0].transcript);
  r.onerror=()=>cb(null); r.onend=()=>{};
  r.start();
  return r;
}

/* ---------------- diagnóstico: TRI de 2 parâmetros, EAP em grade ------- */
const GRID=[...Array(71)].map((_,k)=>+(-3+0.1*k).toFixed(1));
const pIRT=(t,b,a)=>1/(1+Math.exp(-a*(t-b)));
function eap(post){ const s=post.reduce((x,y)=>x+y,0);
  const mu=GRID.reduce((x,t,i)=>x+t*post[i],0)/s;
  const va=GRID.reduce((x,t,i)=>x+((t-mu)**2)*post[i],0)/s;
  return [mu, Math.sqrt(va)];
}
function telaDiagnostico(){
  const blocos=[['leitura','Compreensão escrita',-0.5],['escuta','Compreensão oral',-1.0],
                ['uso','Uso e precisão',-1.5]];
  let bi=0, post=null, usados=[], n=0;
  const iniciar=()=>{ const mu0=blocos[bi][2];
    post=GRID.map(t=>Math.exp(-((t-mu0)**2)/(2*1.5*1.5))); usados=[]; n=0; proximo(); };
  const proximo=()=>{
    const [mu,se]=eap(post);
    if((se<=0.42 && n>=6) || n>=12){
      S.theta[blocos[bi][0]]=+mu.toFixed(2);
      bi++;
      if(bi>=blocos.length){ fim(); return; }
      iniciar(); return;
    }
    const cands=D.diag.filter(i=>i.bl===blocos[bi][0] && !usados.includes(i.id)
      && !(i.tr==='transparente' && mu>-1.6));
    if(!cands.length){ S.theta[blocos[bi][0]]=+mu.toFixed(2); bi++;
      if(bi>=blocos.length){ fim(); return; } iniciar(); return; }
    const it=cands.reduce((m,i)=>{
      const p=pIRT(mu,i.b,i.a), inf=i.a*i.a*p*(1-p);
      return (!m || inf>m.inf)?{i,inf}:m;},null).i;
    render(it, mu, se);
  };
  const render=(it,mu,se)=>{
    app.innerHTML='';
    const audio = it.bl==='escuta';
    app.appendChild($(`<div>
      <div class="sessao"><span>${esc(blocos[bi][1])}</span>
        <span class="pontos">${'<i class="ok"></i>'.repeat(n)}<i class="now"></i>
        ${'<i></i>'.repeat(Math.max(0,11-n))}</span>
        <span>erro-padrão ${se.toFixed(2)}</span></div>
      <div class="folha">
        ${audio?`<p class="sub">Ouça e responda. O texto não aparece.</p>
          <div class="acoes" style="margin:0 0 1rem"><button class="btn btn-sec" id="tocar">
          Ouvir de novo</button></div>`:''}
        ${(!audio && it.base)?`<p class="frase">${esc(it.base)}</p>`:''}
        <p class="enunciado">${esc(it.p)}</p>
        <ul class="alternativas">${it.o.map((o,k)=>
          `<li><button class="alt" data-k="${k}"><span class="tecla">${k+1}</span> ${esc(o)}</button></li>`
        ).join('')}</ul>
        <div class="acoes"><button class="btn-saida" id="nsei">Não sei esta — seguir</button></div>
      </div></div>`));
    if(audio){ falar(it.base, 0.9); document.getElementById('tocar').onclick=()=>falar(it.base,0.9); }
    const responder=(k)=>{
      const acerto = k===it.g;
      post = post.map((v,i)=>{ const p=pIRT(GRID[i],it.b,it.a); return v*(acerto?p:1-p); });
      usados.push(it.id); n++;
      if(it.d>=0 && k===it.d){ const no=null; }
      proximo();
    };
    app.querySelectorAll('.alt').forEach(b=>b.onclick=()=>responder(+b.dataset.k));
    document.getElementById('nsei').onclick=()=>responder(-1);
    document.onkeydown=(ev)=>{ const k=+ev.key; if(k>=1&&k<=4) responder(k-1); };
  };
  const fim=()=>{
    document.onkeydown=null;
    const t=S.theta;
    const faixa=v=>v==null?'—':(v<-2?'A0':v<-1?'A1':v<0?'A2':v<1?'B1':v<2?'B2':v<3?'C1':'C2');
    // entra pela produção: usa o menor θ, e nunca acima de B1 sem produção avaliada
    const menor=Math.min(t.leitura??0,t.escuta??0,t.uso??0);
    const alvoFaixa=faixa(Math.min(menor, 0.9));
    const porta = D.licoes.find(l=>l.porta && l.niv===alvoFaixa) ||
                  D.licoes.find(l=>l.niv===alvoFaixa) || D.licoes[0];
    S.posicao = D.licoes.indexOf(porta);
    S.diagFeito=true; salvar();
    app.innerHTML='';
    app.appendChild($(`<div>
      <h1>Seu ponto de entrada</h1>
      <div class="folha">
        <ul class="niveis">
          <li><span>Compreensão escrita</span><span class="trilho"><span style="width:${
            Math.round(Math.min(100,Math.max(5,(t.leitura+3)/7*100)))}%"></span></span>
            <span class="qecr">${faixa(t.leitura)}</span></li>
          <li><span>Compreensão oral</span><span class="trilho"><span style="width:${
            Math.round(Math.min(100,Math.max(5,(t.escuta+3)/7*100)))}%"></span></span>
            <span class="qecr">${faixa(t.escuta)}</span></li>
          <li><span>Uso e precisão</span><span class="trilho"><span style="width:${
            Math.round(Math.min(100,Math.max(5,(t.uso+3)/7*100)))}%"></span></span>
            <span class="qecr">${faixa(t.uso)}</span></li>
        </ul>
        <p class="sub">A trilha entra pelo nível mais baixo — a produção. O que você lê e ouve é
        servido no nível mais alto. É assim que a rota compensa a competência mais fraca.</p>
        <p><b>Você começa em:</b> ${esc(porta.niv)} · unidade ${porta.un} — ${esc(porta.ut)}</p>
      </div>
      <div class="acoes"><button class="btn" id="ok">Começar a estudar</button></div>
      <div class="aviso"><b>Estimativa, não medida.</b> A dificuldade dos itens ainda é juízo de
      especialista, não valor calibrado. A colocação é revista no 14º dia.</div>
    </div>`));
    document.getElementById('ok').onclick=()=>irPara(telaPainel);
  };
  iniciar();
}

function telaPainel(){
  const dom=Object.values(S.nos);
  const d3=dom.filter(e=>e.d>=3).length, d5=dom.filter(e=>e.d===5).length;
  const ports=S.metricas.portunhol.slice(-5);
  const indice = ports.length? +(ports.reduce((a,b)=>a+b,0)/ports.length).toFixed(1) : null;
  const son=S.metricas.sondas, sonPct = son.tot? Math.round(100*son.ok/son.tot) : null;
  const lic = D.licoes[Math.min(S.posicao,D.licoes.length-1)];
  app.appendChild($(`<div>
    <h1>Onde você está</h1>
    <div class="folha">
      <div class="metricas">
        <div class="metrica" data-t="${indice==null?'':(indice<4?'bom':'alerta')}">
          <div class="valor">${indice==null?'—':indice}</div>
          <div class="rot">índice de portunhol, por 100 palavras</div>
          <div class="barra"><span style="width:${Math.min(100,(indice||0)*10)}%"></span></div></div>
        <div class="metrica" data-t="${sonPct!=null&&sonPct>=70?'bom':''}">
          <div class="valor">${sonPct==null?'—':sonPct+'%'}</div>
          <div class="rot">sons críticos limpos</div>
          <div class="barra"><span style="width:${sonPct||0}%"></span></div></div>
        <div class="metrica">
          <div class="valor">${d3}</div>
          <div class="rot">assuntos consolidados · ${d5} em uso espontâneo</div>
          <div class="barra"><span style="width:${Math.min(100,d3/3)}%"></span></div></div>
      </div>
    </div>
    <h2>O que vem agora</h2>
    <p><b>${esc(lic.niv)} · unidade ${lic.un}</b> — ${esc(lic.ut)}<br>
       <span class="sub">${esc(lic.t)}</span></p>
    <div class="acoes">
      <button class="btn" id="ir">Começar sessão</button>
      <button class="btn btn-sec" id="rel">Ver relatório</button>
      <button class="btn-saida" id="aj">Ajustes</button>
    </div>
    <p class="lista-lim" style="margin-top:2rem">XP ${S.xp} · ${S.seq.dias} dia(s) com sessão ·
    dia ${S.dia} do curso</p>
  </div>`));
  document.getElementById('ir').onclick=()=>irPara(telaSessao);
  document.getElementById('rel').onclick=()=>irPara(telaRelatorio);
  document.getElementById('aj').onclick=()=>irPara(telaAjustes);
}

/* ------------------------------------------------------------- sessão */
function telaSessao(){
  const N=D.p.n; let i=0; const feitos=[]; let atual=null; let erradosNaSessao=new Set();
  const hoje=new Date().toDateString();

  const cabecalho=()=>`<div class="sessao"><span>${i+1} de ${N}</span>
    <span class="pontos">${feitos.map(f=>`<i class="${f.ok?'ok':'x'}"></i>`).join('')}
    <i class="now"></i>${'<i></i>'.repeat(Math.max(0,N-1-feitos.length))}</span>
    <span>${atual?esc(rotulo(atual.f)):''}</span></div>`;
  const rotulo=f=>({mc:'escolha',fala:'pronúncia',guiada:'escrita',livre:'escrita livre'}[f]||f);

  const proximo=()=>{
    document.onkeydown=null;
    if(i>=N){ fim(); return; }
    let a = (i<D.p.cota ? manutencao() : null) || escolher();
    atual=a; app.innerHTML='';
    if(a.f==='mc') renderMC(a); else if(a.f==='fala') renderFala(a); else renderEscrita(a);
  };
  const registrarResposta=(a,ok)=>{
    const no=a.no;
    const superou = ok && erradosNaSessao.has(no);
    if(!ok) erradosNaSessao.add(no);
    registrar(no,a.f,ok);
    S.itens[a.id]=1;
    S.hist.no.push(no); S.hist.f.push(a.f);
    if(S.hist.no.length>50){S.hist.no.shift();S.hist.f.shift();}
    const base={mc:10,escuta:12,guiada:20,livre:30,fala:40}[a.f]||10;
    const mult=[1,1,.8,.5,.3,.1][Math.min(5,est(no).d)];
    S.xp += Math.round(ok ? base*mult*(superou?1.5:1) : base*mult*0.3);
    feitos.push({ok}); i++; salvar();
  };

  const renderMC=(a)=>{
    app.appendChild($(`<div>${cabecalho()}
      <div class="folha">
        <p class="enunciado">${esc(a.p)}</p>
        <ul class="alternativas">${a.o.map((o,k)=>
          `<li><button class="alt" data-k="${k}"><span class="tecla">${k+1}</span> ${esc(o)}</button></li>`
        ).join('')}</ul>
        <div id="depois"></div>
        <div class="acoes" id="acoes">
          <button class="btn-saida" id="nsei">Não sei esta — seguir</button></div>
      </div></div>`));
    const responder=(k)=>{
      document.onkeydown=null;
      const ok = k===a.g;
      app.querySelectorAll('.alt').forEach((b,j)=>{
        b.disabled=true;
        if(j===a.g) b.dataset.e='certo';
        else if(j===k) b.dataset.e = (j===a.d?'pt':'erro');
      });
      const armadilha = (a.d>=0 && k===a.d);
      document.getElementById('depois').innerHTML=`
        <div class="explicacao">
          ${a.t?`<p class="frase">${esc(a.t)}</p>`:''}
          <p class="regra">${esc(a.e)}${armadilha?
            ' <b>Esta é exatamente a resposta que o português produz.</b>':''}</p>
        </div>`;
      document.getElementById('acoes').innerHTML=
        `<button class="btn" id="cont">Continuar</button>`+
        (a.t?` <button class="btn btn-sec" id="ouvir">Ouvir a frase</button>`:'');
      const ouvirBtn=document.getElementById('ouvir');
      if(ouvirBtn) ouvirBtn.onclick=()=>falar(a.t.split('=')[0],0.9);
      document.getElementById('cont').onclick=()=>{ registrarResposta(a,ok); proximo(); };
      document.onkeydown=(ev)=>{ if(ev.key==='Enter'){ registrarResposta(a,ok); proximo(); } };
    };
    app.querySelectorAll('.alt').forEach(b=>b.onclick=()=>responder(+b.dataset.k));
    document.getElementById('nsei').onclick=()=>responder(-1);
    document.onkeydown=(ev)=>{ const k=+ev.key; if(k>=1&&k<=a.o.length) responder(k-1); };
  };

  const renderFala=(a)=>{
    const frase=a.p.replace(/^Diga:\s*/,'');
    app.appendChild($(`<div>${cabecalho()}
      <div class="folha">
        <p class="sub">Leia em voz alta.</p>
        <p class="frase" style="font-size:1.5rem">${esc(frase)}</p>
        <div class="acoes">
          <button class="btn" id="grav" ${TemReconhecimento?'':'disabled'}>
            ${TemReconhecimento?'Gravar':'Sem reconhecimento neste navegador'}</button>
          <button class="btn btn-sec" id="mod">Ouvir o modelo</button>
          <button class="btn-saida" id="sem">Seguir sem microfone</button>
        </div>
        <div id="res"></div>
      </div></div>`));
    document.getElementById('mod').onclick=()=>falar(frase,0.85);
    document.getElementById('sem').onclick=()=>{
      document.getElementById('res').innerHTML=
        `<div class="aviso">Marcado como estimado. Nenhuma decisão de rota depende disto.</div>`;
      registrarResposta(a,true); setTimeout(proximo,700);
    };
    document.getElementById('grav').onclick=()=>{
      const b=document.getElementById('grav'); b.textContent='Ouvindo…'; b.disabled=true;
      ouvir(t=>{
        b.textContent='Gravar'; b.disabled=false;
        if(t===null){ document.getElementById('res').innerHTML=
          `<div class="aviso">Não consegui captar. Tente de novo ou siga sem microfone.</div>`;
          return; }
        const esperado=norm(a.t||frase).split(/\s+/);
        const ouvido=norm(t).split(/\s+/);
        const marcado=ouvido.map(p=>esperado.includes(p)?esc(p):`<b>${esc(p)}</b>`).join(' ');
        const acertos=ouvido.filter(p=>esperado.includes(p)).length;
        const taxa= esperado.length? acertos/esperado.length : 0;
        const ok = taxa>=0.8;
        S.metricas.sondas.tot++; if(ok) S.metricas.sondas.ok++;
        document.getElementById('res').innerHTML=`
          <div class="explicacao">
            <p class="ouvido">Ouvi: ${marcado}</p>
            <p class="regra">${esc(a.e)}</p>
            ${a.cf==='baixa'?`<p class="lista-lim">Esta sonda tem detecção pouco confiável: serve
             para praticar, não entra na sua medida.</p>`:''}
          </div>
          <div class="acoes"><button class="btn" id="cont">Continuar</button></div>`;
        document.getElementById('cont').onclick=()=>{
          registrarResposta(a, a.cf==='baixa' ? true : ok); proximo(); };
      });
    };
  };

  const renderEscrita=(a)=>{
    app.appendChild($(`<div>${cabecalho()}
      <div class="folha">
        <p class="enunciado">${esc(a.p)}</p>
        <textarea id="txt" placeholder="Escreva em espanhol…"></textarea>
        <p class="lista-lim" id="vivo">índice de portunhol: —</p>
        <div class="acoes">
          <button class="btn" id="ent">Entregar</button>
          <button class="btn-saida" id="pular">Não vou fazer esta — seguir</button>
        </div>
        <div id="res"></div>
      </div></div>`));
    const ta=document.getElementById('txt');
    ta.oninput=()=>{ const r=analisar(ta.value);
      document.getElementById('vivo').textContent =
        `índice de portunhol: ${r.n?r.indice:'—'} · ${r.achados.length} ponto(s) detectado(s)`; };
    document.getElementById('pular').onclick=()=>{ registrarResposta(a,false); proximo(); };
    document.getElementById('ent').onclick=()=>{
      const r=analisar(ta.value);
      if(r.n<8){ document.getElementById('res').innerHTML=
        `<div class="aviso">Escreva um pouco mais antes de entregar.</div>`; return; }
      S.metricas.portunhol.push(r.indice);
      const tres=r.achados.filter(x=>x.cf!=='baixa').slice(0,3);
      document.getElementById('res').innerHTML=`
        <div class="explicacao">
          <p class="regra">Índice de portunhol: <b>${r.indice}</b> por 100 palavras.</p>
          ${tres.length? '<ul>'+tres.map(x=>
            `<li><code>${esc(x.t)}</code> — ${esc(x.e)}</li>`).join('')+'</ul>'
            : '<p class="regra">Nenhuma interferência do português detectada.</p>'}
          <p class="lista-lim">Mostramos no máximo três pontos. O resto vai para o seu perfil e
          volta como conteúdo.</p>
        </div>
        <div class="acoes"><button class="btn" id="cont">Continuar</button></div>`;
      document.getElementById('cont').onclick=()=>{ registrarResposta(a, r.indice<6); proximo(); };
    };
  };

  const fim=()=>{
    // nunca terminar em erro
    if(feitos.length && !feitos[feitos.length-1].ok){ feitos.push({ok:true}); }
    S.dia++; rebaixar();
    if(S.seq.ultimo!==hoje){ S.seq.dias++; S.seq.ultimo=hoje; }
    const alvo=ORDEM_NOS[Math.min(S.posicao,ORDEM_NOS.length-1)];
    const retag = ORDEM_NOS.slice(Math.max(0,S.posicao-20),S.posicao).filter(n=>S.nos[n]);
    const manut = retag.length>=5 ? retag.reduce((a,n)=>a+est(n).d,0)/retag.length : 9;
    if(est(alvo).d>=3 && manut>=2.5) S.posicao++;
    salvar();
    app.innerHTML='';
    const ok=feitos.filter(f=>f.ok).length;
    app.appendChild($(`<div>
      <h1>Sessão concluída</h1>
      <div class="folha">
        <p>${ok} de ${feitos.length} atividades corretas. XP total: ${S.xp}.</p>
        <p class="sub">A próxima sessão começa pelo que você está mais perto de esquecer.</p>
      </div>
      <div class="acoes"><button class="btn" id="v">Voltar ao painel</button></div>
    </div>`));
    document.getElementById('v').onclick=()=>irPara(telaPainel);
  };
  proximo();
}

/* ---------------------------------------------------------- relatório */
function telaRelatorio(){
  const nos=Object.entries(S.nos).sort((a,b)=>b[1].d-a[1].d);
  const fortes=nos.slice(0,5), fracos=nos.filter(([,e])=>e.d<3).slice(0,5);
  const nome=n=>LIC_POR_NO[n]?LIC_POR_NO[n].t:n;
  const ports=S.metricas.portunhol;
  app.appendChild($(`<div>
    <h1>Relatório</h1>
    <div class="folha">
      <h3>Índice de portunhol</h3>
      <p>${ports.length? ports.map(v=>v.toFixed(1)).join(' · ') :
        'Ainda sem produção escrita entregue.'}</p>
      <h3>Assuntos mais firmes</h3>
      <ul>${fortes.map(([n,e])=>`<li>${esc(nome(n))} — domínio ${e.d}</li>`).join('')||'<li>—</li>'}</ul>
      <h3>O que precisa voltar</h3>
      <ul>${fracos.map(([n,e])=>`<li>${esc(nome(n))} — domínio ${e.d}</li>`).join('')||'<li>—</li>'}</ul>
    </div>
    <div class="aviso"><b>O que este relatório não faz:</b> não dá nota única, não compara você
    com ninguém e não estima data de conclusão.</div>
    <div class="acoes"><button class="btn" id="v">Voltar</button></div>
  </div>`));
  document.getElementById('v').onclick=()=>irPara(telaPainel);
}

/* ------------------------------------------------------------ ajustes */
function telaAjustes(){
  app.appendChild($(`<div>
    <h1>Ajustes</h1>
    <div class="folha">
      <h3>Seu progresso</h3>
      <p class="sub">Tudo fica neste navegador. Nada é enviado para lugar nenhum.</p>
      <div class="acoes">
        <button class="btn" id="exp">Baixar meu progresso</button>
        <button class="btn btn-sec" id="imp">Carregar de um arquivo</button>
        <input type="file" id="arq" class="oculto" accept="application/json">
      </div>
      <h3>Recomeçar</h3>
      <div class="acoes"><button class="btn-saida" id="zerar">Apagar tudo e recomeçar</button></div>
      <h3>Este navegador</h3>
      <p class="lista-lim">Síntese de voz: ${('speechSynthesis' in window)?'disponível':'ausente'} ·
      Reconhecimento de fala: ${TemReconhecimento?'disponível':'ausente (use Chrome ou Edge)'}</p>
    </div>
    <div class="acoes"><button class="btn" id="v">Voltar</button></div>
  </div>`));
  document.getElementById('exp').onclick=()=>{
    const b=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='progresso-espanhol.json'; a.click();
  };
  document.getElementById('imp').onclick=()=>document.getElementById('arq').click();
  document.getElementById('arq').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ localStorage.setItem(CHAVE_BK, JSON.stringify(S));
      S=migrar(JSON.parse(r.result)); salvar(); irPara(telaPainel);
    }catch(_){ alert('Arquivo inválido. Seu progresso atual não foi tocado.'); } };
    r.readAsText(f);
  };
  document.getElementById('zerar').onclick=()=>{
    if(confirm('Apagar todo o progresso deste navegador?')){
      localStorage.setItem(CHAVE_BK, JSON.stringify(S));
      S=novoEstado(); salvar(); irPara(telaAbertura);
    }
  };
  document.getElementById('v').onclick=()=>irPara(telaPainel);
}

/* --------------------------------------------------------------- início */
irPara(S.diagFeito ? telaPainel : telaAbertura);
</script>
